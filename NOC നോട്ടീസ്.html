<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<title>NOC നോട്ടീസ്</title><meta name="theme-color" content="#1b5e20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NOC">
<style>
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);font-family:"Nirmala UI","Noto Sans Malayalam","Manjari","Kartika",sans-serif;background:#eceff1;color:#222}
.app{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px #0003;width:340px;max-width:100%}
.panel h2{margin:0 0 8px;font-size:16px}
label{display:block;font-size:12px;margin:8px 0 2px;color:#555}
input,textarea{width:100%;padding:7px;border:1px solid #bbb;border-radius:6px;font:inherit;font-size:14px}
textarea{min-height:90px}
button{padding:8px 12px;border:0;border-radius:6px;background:#1a5fb4;color:#fff;font:inherit;font-size:13px;cursor:pointer;margin:6px 4px 0 0}
button.g{background:#2e7d32}button.r{background:#c62828}button.o{background:#607d8b}
.sheetwrap{overflow:hidden;max-width:100%;flex:1;min-width:300px}
#list{max-height:300px;overflow:auto;margin-top:6px}
.it{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:5px 0;font-size:12px;gap:4px}
.it small{color:#777;display:block}
.it button{padding:4px 7px;font-size:11px;margin:0}
.letter{width:210mm;height:297mm;background:#fff;padding:12mm 15mm 10mm 27mm;font-size:11.5pt;line-height:1.4;position:relative;overflow:hidden;color:#000}
.letter .em{text-align:center;height:24mm}.letter .em img{height:23mm}
.hd{display:grid;grid-template-columns:93mm 75mm;margin-top:1mm}
.hd div{min-height:1.5em;white-space:nowrap}
.hd .sp{margin-bottom:3mm}
.ind1{padding-left:4.5mm}.ind2{padding-left:17mm}.ind3{padding-left:16mm}.ind4{padding-left:3.5mm}
.addr{font-weight:bold;font-style:italic}
.subj{margin-top:4mm;padding-left:19.5mm;text-indent:-19.5mm}
.j{text-align:justify;margin:1.5mm 0}
.fi{display:inline-block;text-align:center;border-bottom:1.5px dotted #000;min-width:30mm;line-height:1.2}
.lst{padding-left:3.5mm;margin:0}.lst p{margin:0 0 .5mm;text-align:justify;padding-left:2mm;text-indent:-2mm}
.close{font-weight:bold;margin:5mm 0 0 2mm;text-align:justify}
.sig{margin:14mm 0 0 98mm;width:67mm;text-align:center;font-weight:bold;line-height:1.5}
#printArea{display:none}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app{display:none}
 #printArea{display:block}.letter{height:296mm;page-break-after:always;break-after:page;box-shadow:none}.letter:last-child{page-break-after:auto;break-after:auto}
}

body{background:#f2f4f7;font-size:15px}
input,textarea{font-size:16px;padding:10px}
.bar{position:sticky;top:0;z-index:5;background:#1b5e20;color:#fff;display:flex;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
.bar img{height:36px;width:36px;object-fit:cover;background:#fff;border-radius:50%}
.bar b{display:block;font-size:17px}.bar small{opacity:.85;font-size:12px}
.views{padding-bottom:84px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px;box-shadow:0 1px 4px #0002}
.card h2{margin:0 0 6px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.row button{flex:1;margin:0;padding:11px 10px;font-size:14px}
.hint{font-size:11px;color:#777}
.v{display:none}
body[data-tab="1"] #v1,body[data-tab="2"] #v2,body[data-tab="3"] #v3{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;margin:0;border-radius:0;background:none;color:#666;padding:8px 0;font-size:12px;line-height:1.3}
body[data-tab="1"] #t1,body[data-tab="2"] #t2,body[data-tab="3"] #t3{color:#1b5e20;font-weight:bold;border-top:3px solid #1b5e20}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.sheetwrap{padding:8px 12px 4px;min-width:0}
@media(min-width:900px){.views{display:flex;gap:4px;align-items:flex-start;padding-bottom:16px}.v{display:block!important}#v1{width:340px;flex:none}#v2{flex:1;min-width:0}#v3{width:320px;flex:none}.tabs{display:none}}
@media print{.bar,.views,.tabs,#toast{display:none!important}}
